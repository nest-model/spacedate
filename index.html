<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#02030b">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Для тебя">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%AB%3C/text%3E%3C/svg%3E">
<title>Наша галактика</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300;1,500&family=Manrope:wght@400;600&display=swap">
<style>
/* Layout: one fixed, edge-to-edge stage (made for a portrait iPhone). A WebGL particle universe sits at the back,
   floating words and photos are DOM billboards projected from the same camera, the scene captions sit in the lower third,
   a slim icon HUD is pinned under the notch, and the invitation card opens in a dimmed layer on top.
   One deliberate dark look, so every color is explicit. */
:root {
  --space: #02030b;
  --ink: #f6f0ff;
  --mute: #b9afd9;
  --rose: #ff86b9;
  --blush: #ffd5e8;
  --champagne: #f4dfa8;
  --edge: rgba(255, 255, 255, .2);
  --display: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --body: "Manrope", -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--space); color: var(--ink); font-family: var(--body);
  overflow: hidden; overscroll-behavior: none;
  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
  -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
}
button, label { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--blush); outline-offset: 3px; }

.stage { position: fixed; inset: 0; overflow: hidden; isolation: isolate; touch-action: none; background: var(--space); }
#cosmos, #fx { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#fx { z-index: 40; pointer-events: none; }
.vignette {
  position: absolute; inset: 0; z-index: 1; pointer-events: none;
  background: radial-gradient(130% 95% at 50% 46%, transparent 52%, rgba(2, 3, 11, .7) 100%);
}

/* ---------- 3D overlays ---------- */
.flare {
  position: absolute; left: 0; top: 0; z-index: 2; width: 0; height: 0; pointer-events: none;
  opacity: 0; mix-blend-mode: screen; will-change: transform, opacity;
}
.flare::before {
  content: ""; position: absolute; left: -60px; top: -60px; width: 120px; height: 120px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 246, 250, .95) 0, rgba(255, 196, 228, .42) 22%, rgba(160, 120, 255, .16) 48%, transparent 70%);
}
.flare::after {
  content: ""; position: absolute; left: -170px; top: -1px; width: 340px; height: 2px;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .95), transparent);
  box-shadow: 0 0 14px 1px rgba(255, 205, 235, .55);
}
.items { position: absolute; inset: 0; z-index: 3; pointer-events: none; overflow: hidden; }
.word {
  position: absolute; left: 0; top: 0; padding: 12px 14px; white-space: nowrap; opacity: 0; pointer-events: none;
  font: 400 12px/1 var(--body); letter-spacing: .05em; color: rgba(255, 255, 255, .9);
  text-shadow: 0 0 10px rgba(255, 170, 215, .6), 0 1px 2px rgba(0, 0, 0, .7);
  will-change: transform, opacity; cursor: pointer;
}
.word.live, .photo.live { pointer-events: auto; }
.photo {
  position: absolute; left: 0; top: 0; width: 58px; height: 58px; border-radius: 8px; overflow: hidden; opacity: 0; pointer-events: none;
  border: 1.5px solid rgba(255, 255, 255, .6); box-shadow: 0 0 24px rgba(255, 160, 210, .35), 0 6px 18px rgba(0, 0, 0, .5);
  will-change: transform, opacity; cursor: pointer;
}
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
.heart-label {
  position: absolute; left: 0; top: 0; z-index: 3; opacity: 0; pointer-events: none; white-space: nowrap;
  font: italic 500 30px/1 var(--display); color: #fff; will-change: transform, opacity;
  text-shadow: 0 0 10px rgba(255, 205, 232, .95), 0 0 26px rgba(255, 110, 175, .8), 0 0 56px rgba(160, 90, 255, .6);
}

/* ---------- HUD ---------- */
.hud {
  position: absolute; z-index: 20; top: 0; left: 0; right: 0; pointer-events: none;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: calc(var(--safe-t) + 10px) max(14px, var(--safe-r)) 0 max(14px, var(--safe-l));
}
.hud > * { pointer-events: auto; }
.hud-actions { display: flex; gap: 10px; }
.dots { display: flex; }
.dot { position: relative; width: 22px; height: 40px; padding: 0; border: 0; background: none; cursor: pointer; }
.dot::before {
  content: ""; position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; border-radius: 99px;
  transform: translate(-50%, -50%); background: rgba(255, 255, 255, .3);
  transition: width .5s ease, background .5s ease, box-shadow .5s ease;
}
.dot.on::before { width: 22px; background: linear-gradient(90deg, #fff, var(--rose)); box-shadow: 0 0 12px rgba(255, 130, 190, .8); }
.icon-btn {
  display: grid; place-items: center; width: 42px; height: 42px; padding: 0; border-radius: 99px; cursor: pointer;
  color: var(--ink); background: rgba(10, 8, 34, .5); border: 1px solid var(--edge);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  transition: background .3s, border-color .3s, transform .2s;
}
.icon-btn:hover { background: rgba(70, 40, 140, .55); border-color: rgba(255, 170, 215, .6); }
.icon-btn:active { transform: scale(.94); }
.icon-btn svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.sr-file { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }

/* ---------- Scenes ---------- */
#scenes { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
.scene {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; gap: 1rem; text-align: center;
  padding: calc(var(--safe-t) + 64px) max(20px, var(--safe-r)) calc(var(--safe-b) + 28px) max(20px, var(--safe-l));
  opacity: 0; visibility: hidden; transition: opacity .9s ease, visibility 0s linear .9s;
}
.scene.active { opacity: 1; visibility: visible; transition: opacity 1s ease .3s, visibility 0s; }
.scene--center { justify-content: center; }
.scene--low { justify-content: flex-end; }
.scene--low::before {
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 52%; z-index: -1; pointer-events: none;
  background: linear-gradient(to top, rgba(2, 3, 11, .86), rgba(2, 3, 11, .45) 60%, transparent);
}
.rv { opacity: 0; transform: translateY(14px); filter: blur(7px); transition: opacity 1.2s ease, transform 1.2s cubic-bezier(.2, .7, .2, 1), filter 1.2s ease; }
.rv.on { opacity: 1; transform: none; filter: none; }
.eyebrow { margin: 0; font: 600 .7rem/1.4 var(--body); letter-spacing: .34em; text-transform: uppercase; color: var(--blush); }
.title {
  margin: 0; font-family: var(--display); font-style: italic; font-weight: 300; color: #fff; text-wrap: balance;
  font-size: clamp(3.4rem, 17vw, 8rem); line-height: .96;
  text-shadow: 0 0 36px rgba(255, 120, 190, .55), 0 0 90px rgba(130, 90, 255, .55);
}
.line {
  margin: 0; max-width: 26ch; text-wrap: balance; color: var(--ink);
  font-family: var(--display); font-style: italic; font-weight: 500;
  font-size: clamp(1.3rem, 1rem + 2.2vw, 2.4rem); line-height: 1.24;
  text-shadow: 0 2px 22px rgba(2, 3, 11, .95), 0 0 28px rgba(130, 90, 255, .35);
}
.cta { margin-top: .5rem; pointer-events: auto; }
.cta.rv:not(.on) { pointer-events: none; }

/* Buttons */
.btn {
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: .5em;
  min-height: 50px; padding: .9em 1.9em; border-radius: 99px; cursor: pointer; pointer-events: auto;
  font: 600 .8rem/1 var(--body); letter-spacing: .16em; text-transform: uppercase; color: #fff;
  background: linear-gradient(180deg, rgba(255, 255, 255, .17), rgba(255, 255, 255, .05));
  border: 1px solid rgba(255, 255, 255, .42);
  box-shadow: 0 0 30px rgba(255, 120, 190, .32), 0 8px 26px rgba(0, 0, 0, .45);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  transition: transform .25s ease, box-shadow .3s ease, border-color .3s ease, background .3s ease;
}
.btn:hover { border-color: rgba(255, 190, 225, .9); box-shadow: 0 0 40px rgba(255, 120, 190, .5), 0 8px 26px rgba(0, 0, 0, .45); }
.btn:active { transform: scale(.97); }
.btn--solid { background: linear-gradient(180deg, #ff9cc6, #e0558f); border-color: rgba(255, 220, 238, .7); text-shadow: 0 1px 6px rgba(120, 20, 70, .5); }
.btn--ghost { background: rgba(10, 8, 34, .5); box-shadow: none; }
.cta.on .btn:not(.btn--ghost) { animation: ctaGlow 3s ease-in-out infinite; }
@keyframes ctaGlow {
  0%, 100% { box-shadow: 0 0 26px rgba(255, 120, 190, .28), 0 8px 26px rgba(0, 0, 0, .45); }
  50% { box-shadow: 0 0 46px rgba(255, 120, 190, .55), 0 8px 26px rgba(0, 0, 0, .45); }
}

.toast {
  position: absolute; z-index: 25; left: 50%; top: calc(var(--safe-t) + 66px); transform: translate(-50%, -8px);
  max-width: min(calc(100% - 32px), 420px); padding: .75em 1.3em; border-radius: 99px; text-align: center;
  font: 500 .92rem/1.35 var(--body); color: var(--ink);
  background: rgba(16, 10, 50, .72); border: 1px solid rgba(255, 170, 215, .4);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  opacity: 0; pointer-events: none; transition: opacity .5s ease, transform .5s ease;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* ---------- Invitation ---------- */
.invite {
  position: absolute; inset: 0; z-index: 30; display: grid; place-items: center; overflow-y: auto;
  padding: calc(var(--safe-t) + 16px) max(16px, var(--safe-r)) calc(var(--safe-b) + 16px) max(16px, var(--safe-l));
  background: radial-gradient(90% 80% at 50% 45%, rgba(2, 3, 11, .5), rgba(2, 3, 11, .9));
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  opacity: 0; transition: opacity .6s ease; touch-action: pan-y;
}
.invite.show { opacity: 1; }
.card {
  position: relative; width: min(100%, 480px); margin: auto; text-align: center;
  padding: clamp(1.7rem, 6vw, 2.6rem) clamp(1.3rem, 6vw, 2.4rem);
  border-radius: 26px; border: 1px solid rgba(255, 255, 255, .2);
  background: linear-gradient(165deg, rgba(34, 22, 84, .8), rgba(10, 7, 34, .9));
  box-shadow: 0 0 0 1px rgba(255, 255, 255, .04) inset, 0 30px 90px rgba(0, 0, 0, .6), 0 0 80px rgba(150, 90, 255, .28);
  transform: translateY(30px) scale(.95); filter: blur(8px);
  transition: transform .9s cubic-bezier(.2, .8, .2, 1), filter .9s ease;
}
.invite.show .card { transform: none; filter: none; }
.card::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(110deg, transparent 38%, rgba(255, 255, 255, .1) 50%, transparent 62%);
  background-size: 250% 100%; animation: sheen 6s linear infinite;
}
@keyframes sheen { from { background-position: 150% 0; } to { background-position: -100% 0; } }
.card > div { position: relative; z-index: 1; }
.mini-heart { width: 30px; height: 30px; margin: 0 auto .9rem; display: block; filter: drop-shadow(0 0 10px rgba(255, 110, 175, .9)); animation: beat 2s ease-in-out infinite; }
@keyframes beat { 0%, 100% { transform: scale(1); } 14% { transform: scale(1.14); } 28% { transform: scale(1); } 42% { transform: scale(1.08); } 56% { transform: scale(1); } }
.card-title {
  margin: .9rem 0 0; font-family: var(--display); font-style: italic; font-weight: 500; color: #fff; text-wrap: balance;
  font-size: clamp(1.9rem, 7vw, 2.8rem); line-height: 1.12;
}
.nm { color: var(--blush); text-shadow: 0 0 20px rgba(255, 110, 175, .75); }
.card-text { margin: 1rem auto 0; max-width: 32ch; font-size: 1rem; line-height: 1.55; color: var(--mute); }
.details { margin: 1.5rem auto 0; max-width: 36ch; padding: .4rem 0; text-align: left; border-top: 1px solid rgba(255, 255, 255, .14); border-bottom: 1px solid rgba(255, 255, 255, .14); }
.details > div { display: grid; grid-template-columns: 4.8rem minmax(0, 1fr); gap: .8rem; align-items: baseline; padding: .7rem 0; }
.details > div + div { border-top: 1px solid rgba(255, 255, 255, .08); }
.details dt { font: 600 .66rem/1.4 var(--body); letter-spacing: .22em; text-transform: uppercase; color: var(--blush); }
.details dd { margin: 0; font: 400 .98rem/1.45 var(--body); color: var(--ink); }
.actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 1.6rem; min-height: 50px; }
#noBtn { transition: transform .38s cubic-bezier(.3, 1.5, .5, 1), box-shadow .3s ease, border-color .3s ease, background .3s ease; }
.close {
  position: absolute; z-index: 2; top: 12px; right: 12px; width: 40px; height: 40px; border-radius: 99px; cursor: pointer;
  font: 300 1.5rem/1 var(--body); color: var(--ink); background: rgba(255, 255, 255, .06); border: 1px solid var(--edge);
  transition: background .3s;
}
.close:hover { background: rgba(255, 255, 255, .14); }

@media (max-height: 520px) {
  .scene { gap: .5rem; padding-top: calc(var(--safe-t) + 52px); padding-bottom: calc(var(--safe-b) + 14px); }
  .line { font-size: clamp(1.05rem, 3vw, 1.5rem); }
  .title { font-size: clamp(2.4rem, 12vh, 4.2rem); }
  .btn { min-height: 42px; padding: .7em 1.5em; }
}
@media (prefers-reduced-motion: reduce) {
  .rv { transition-duration: .01s; transition-delay: 0s; transform: none; filter: none; }
  .rv:not(.on) { opacity: 0; }
  .mini-heart, .card::after, .cta.on .btn { animation: none; }
  .scene, .scene.active, .invite, .card { transition-duration: .01s; transition-delay: 0s; }
}
</style>
</head>
<body>
<main class="stage" id="stage">
  <canvas id="cosmos" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>
  <div class="flare" id="flare" aria-hidden="true"></div>
  <div class="items" id="items"></div>
  <div class="heart-label" id="heartLabel" aria-hidden="true"></div>

  <header class="hud">
    <div class="dots" id="dots" role="group" aria-label="Сцены"></div>
    <div class="hud-actions">
      <label class="icon-btn" id="photoBtn" for="photoInput" aria-label="Добавить фото" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><circle cx="9" cy="10.5" r="1.6"/><path d="M4 17l5-4.5 4 3.5 3-2.5 4 3.5"/></svg>
      </label>
      <button class="icon-btn" id="skip" type="button" aria-label="Пропустить сцену">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l6 6-6 6M12 6l6 6-6 6"/></svg>
      </button>
      <button class="icon-btn" id="restart" type="button" aria-label="Начать заново">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5"/></svg>
      </button>
    </div>
  </header>
  <input class="sr-file" id="photoInput" type="file" accept="image/*" multiple tabindex="-1">

  <div id="scenes"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="invite" id="invite" role="dialog" aria-modal="true" aria-labelledby="inviteTitle" hidden>
    <div class="card" id="card">
      <button class="close" id="closeInvite" type="button" aria-label="Закрыть">×</button>
      <div id="ask">
        <svg class="mini-heart" viewBox="0 0 24 24" aria-hidden="true"><path fill="#ff7eb6" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        <p class="eyebrow" id="invEyebrow"></p>
        <h2 class="card-title" id="inviteTitle"></h2>
        <dl class="details" id="details"></dl>
        <div class="actions">
          <button class="btn btn--solid" id="yesBtn" type="button"></button>
          <button class="btn btn--ghost" id="noBtn" type="button"></button>
        </div>
      </div>
      <div id="yes" hidden>
        <svg class="mini-heart" viewBox="0 0 24 24" aria-hidden="true"><path fill="#ff7eb6" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        <p class="eyebrow" id="doneEyebrow"></p>
        <h2 class="card-title" id="doneTitle"></h2>
        <p class="card-text" id="doneText"></p>
        <div class="actions">
          <button class="btn btn--solid" id="replay" type="button"></button>
          <button class="btn btn--ghost" id="closeYes" type="button"></button>
        </div>
      </div>
    </div>
  </div>

  <canvas id="fx" aria-hidden="true"></canvas>
</main>

<script>
/* =====================================================================
   НАСТРОЙКИ. Все тексты и данные меняй только здесь.
   {name} в любом тексте подставляется как имя из поля name.
   ===================================================================== */
var CONFIG = {
  name: 'Саша',
  heartText: 'Саша',            // надпись внутри сердца

  // Слова, которые плавают вокруг галактики (можно добавлять и удалять)
  words: [
    'Люблю тебя', 'Моя любимая', 'Ты — моё солнце', 'Обожаю тебя', 'Ты у меня одна',
    'Любовь моей жизни', 'Всегда вместе', 'Ты прекрасна', 'Ты — моё всё', 'С тобой тепло', 'Моя Вселенная'
  ],

  // Фото, которые плавают вместе со словами. Сюда вставляются строки вида 'data:image/jpeg;base64,...'
  photos: [],
  // Кнопка «фото» в углу: позволяет примерить свои фото прямо с телефона.
  // Перед тем как отправить сайт Саше, поставь false.
  photoPicker: false,

  intro: {
    eyebrow: 'Маленькая история',
    title: 'Для тебя',
    line: 'Это путешествие создано для одного человека во всей Вселенной.',
    button: 'Начать путешествие'
  },

  // Сцены 1-5: строки текста и подпись кнопки
  scenes: [
    { lines: ['Во Вселенной больше звёзд, чем песчинок на всех пляжах Земли.', 'Но каждый вечер я ищу взглядом только одну.'], button: 'Лететь дальше' },
    { lines: ['Среди миллиардов галактик есть одна, самая тёплая.', 'В ней живёт девушка, которая освещает всё вокруг.'], button: 'Приблизиться' },
    { lines: ['Ты — моё самое светлое чудо во всей Вселенной.'], button: 'Дальше' },
    { lines: ['С тобой даже тишина звучит как музыка звёзд.', 'Коснись слов, и они прилетят к тебе. Потяни экран, чтобы покрутить космос.'], button: 'Дальше' },
    { lines: ['Но самое важное я приберёг напоследок.', 'У меня для тебя есть одно приглашение.'], button: 'Открыть приглашение' }
  ],

  invite: {
    eyebrow: 'Приглашение',
    title: '{name}, пойдёшь со мной на свидание?',
    details: [
      ['Когда', 'В среду, на весь день'],
      ['С нами', 'Шампанское'],
      ['Куда', 'Пока секрет']
    ],
    yes: 'Да, пойду',
    no: ['Подумаю…', 'Точно подумаю?', 'А если подумать ещё раз?', 'Ну пожалуйста', 'Ладно, да!'],
    doneEyebrow: 'Ответ получен',
    doneTitle: 'Ура! Это будет лучший день.',
    doneText: 'Я уже считаю часы до среды, {name}.',
    replay: 'Пройти заново',
    close: 'Закрыть'
  }
};
</script>

<script>
(function () {
  'use strict';

  var TAU = Math.PI * 2;
  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  function closeInvite(instant) {
    invite.classList.remove('show');
    if (instant || reduce) { invite.hidden = true; }
    else {
      setTimeout(function () { if (!invite.classList.contains('show')) invite.hidden = true; }, 650);
      if (openBtn) openBtn.focus({ preventScroll: true });
    }
  }
  function sayYes() {
    askV.hidden = true; yesV.hidden = false;
    var r = card.getBoundingClientRect(), s = stage.getBoundingClientRect();
    burst(r.left + r.width / 2 - s.left, r.top + r.height / 3 - s.top, 30);
    rainUntil = tNow + (reduce ? 1.2 : 6);
    glow = 1; if (!reduce) fovKick = .7;
    setTimeout(function () { var rp = $('#replay'); if (rp) rp.focus({ preventScroll: true }); }, 80);
  }
  function dodge() {
    var now = performance.now();
    if (now - lastDodge < 220) return;
    lastDodge = now; noCount++;
    if (noCount >= NO_TEXT.length - 1) {
      noBtn.textContent = T(NO_TEXT[NO_TEXT.length - 1]); noBtn.classList.add('is-yes', 'btn--solid');
      noBtn.classList.remove('btn--ghost'); noBtn.style.transform = ''; nx = 0; ny = 0;
      return;
    }
    noBtn.textContent = T(NO_TEXT[noCount]);
    var b = noBtn.getBoundingClientRect(), y = yesBtn.getBoundingClientRect(), s = stage.getBoundingClientRect();
    var baseL = b.left - nx, baseT = b.top - ny;
    for (var k = 0; k < 16; k++) {
      var tx = rand(-130, 130), ty = rand(-80, 80), L = baseL + tx, Tp = baseT + ty;
      if (L < s.left + 12 || L + b.width > s.right - 12 || Tp < s.top + 70 || Tp + b.height > s.bottom - 12) continue;
      if (L < y.right + 10 && L + b.width > y.left - 10 && Tp < y.bottom + 10 && Tp + b.height > y.top - 10) continue;
      nx = tx; ny = ty; break;
    }
    noBtn.style.transform = 'translate(' + nx + 'px,' + ny + 'px)';
  }
  var toastT = 0;
  function toast(msg) {
    toastEl.textContent = msg; toastEl.classList.add('on');
    clearTimeout(toastT);
    toastT = setTimeout(function () { toastEl.classList.remove('on'); }, 2600);
  }

  /* ================================================================
     Photos picked on the device
     ================================================================ */
  function addPhotoFile(f) {
    if (!f || !/^image\//.test(f.type) || items.filter(function (m) { return m.type === 'photo'; }).length >= 14) return;
    var url = URL.createObjectURL(f), im = new Image();
    im.onload = function () {
      var s = Math.min(im.naturalWidth, im.naturalHeight), c = document.createElement('canvas');
      c.width = c.height = 240;
      c.getContext('2d').drawImage(im, (im.naturalWidth - s) / 2, (im.naturalHeight - s) / 2, s, s, 0, 0, 240, 240);
      URL.revokeObjectURL(url);
      addItem('photo', c.toDataURL('image/jpeg', .85), items.length * 3 + 1, 1);
      toast('Фото добавлено');
    };
    im.onerror = function () { URL.revokeObjectURL(url); };
    im.src = url;
  }

  /* ================================================================
     Input
     ================================================================ */
  function wire() {
    var dotsEl = $('#dots');
    scenes.forEach(function (s, i) {
      var b = mk('button', 'dot'); b.type = 'button';
      b.setAttribute('aria-label', 'Сцена ' + (i + 1) + ' из ' + scenes.length);
      b.addEventListener('click', function () { goTo(i); });
      dotsEl.appendChild(b);
    });
    $$('[data-next]').forEach(function (b) { b.addEventListener('click', function () { goTo(cur + 1); }); });
    $('#skip').addEventListener('click', function () { goTo(cur + 1); });
    $('#restart').addEventListener('click', function () { goTo(0, true); });
    openBtn.addEventListener('click', openInvite);
    $('#closeInvite').addEventListener('click', function () { closeInvite(); });
    $('#closeYes').addEventListener('click', function () { closeInvite(); });
    $('#replay').addEventListener('click', function () { closeInvite(true); goTo(0, true); });
    yesBtn.addEventListener('click', sayYes);
    noBtn.addEventListener('pointerenter', function () { if (!noBtn.classList.contains('is-yes')) dodge(); });
    noBtn.addEventListener('click', function () { if (noBtn.classList.contains('is-yes')) sayYes(); else dodge(); });

    if (C.photoPicker) {
      $('#photoBtn').hidden = false;
      $('#photoInput').addEventListener('change', function (e) {
        Array.prototype.slice.call(e.target.files || [], 0, 14).forEach(addPhotoFile);
        e.target.value = '';
      });
    }

    document.addEventListener('keydown', function (e) {
      if (!invite.hidden) {
        if (e.key === 'Escape') { closeInvite(); return; }
        if (e.key === 'Tab') {
          var f = $$('button', card).filter(function (el) { return !el.closest('[hidden]'); });
          if (!f.length) return;
          var first = f[0], lastEl = f[f.length - 1];
          if (e.shiftKey && document.activeElement === first) { e.preventDefault(); lastEl.focus(); }
          else if (!e.shiftKey && document.activeElement === lastEl) { e.preventDefault(); first.focus(); }
        }
        return;
      }
      if (e.key === 'ArrowRight' || e.key === 'PageDown') goTo(cur + 1);
      else if (e.key === 'ArrowLeft' || e.key === 'PageUp') goTo(cur - 1);
    });

    // drag to orbit
    stage.addEventListener('pointerdown', function (e) {
      if (e.target.closest && e.target.closest('button,label,.invite,.hud,input')) return;
      drag = { id: e.pointerId, x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY };
      dragMoved = false;
    });
    window.addEventListener('pointermove', function (e) {
      if (!drag || e.pointerId !== drag.id) return;
      var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      drag.x = e.clientX; drag.y = e.clientY;
      if (Math.abs(e.clientX - drag.sx) + Math.abs(e.clientY - drag.sy) > 8) dragMoved = true;
      if (dragMoved) {
        dYaw = clamp(dYaw - dx * .006, -.9, .9);
        dPitch = clamp(dPitch + dy * .005, -.5, .7);
        lastDragT = tNow;
      }
    });
    function endDrag(e) {
      if (!drag || e.pointerId !== drag.id) return;
      var moved = dragMoved, t = e.target;
      drag = null; lastDragT = tNow;
      if (!moved && (t === cv || t === stage)) {
        var r = stage.getBoundingClientRect();
        burst(e.clientX - r.left, e.clientY - r.top, 8);
      }
    }
    window.addEventListener('pointerup', endDrag);
    window.addEventListener('pointercancel', endDrag);

    cv.addEventListener('webglcontextlost', function (e) { e.preventDefault(); glOK = false; });
    cv.addEventListener('webglcontextrestored', function () { initGL(); });
    if (typeof ResizeObserver !== 'undefined') new ResizeObserver(resize).observe(stage);
    window.addEventListener('resize', resize);
  }

  /* ================================================================
     Start
     ================================================================ */
  buildScenes();
  buildInvite();
  buildItems();
  buildData();
  resize();
  initGL();
  wire();
  goTo(0, true);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
